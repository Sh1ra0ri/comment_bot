server {
    listen 80;
    server_name _;

    location /webhook {
        proxy_pass http://app:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /oauth/callback {
        proxy_pass http://app:8000/oauth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


